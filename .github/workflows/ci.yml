name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: tests
        run: node --test tests/*.test.mjs
      - name: the crafted example must stay clean
        run: node scripts/slop-lint.mjs examples/after.html --fail-under 100
      - name: the slop example must stay bad
        run: node scripts/slop-lint.mjs examples/before.html --fail-under 40 && exit 1 || test $? -eq 1
